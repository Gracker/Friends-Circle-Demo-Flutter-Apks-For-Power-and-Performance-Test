name: Flutter CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - { name: '3.27', flutter: '3.27.0', description: 'v27 (SurfaceView)' }
          - { name: '3.29', flutter: '3.29.0', description: 'v29 (SurfaceView)' }
          - { name: '3.27_TextureView', flutter: '3.27.0', description: 'v27 (TextureView)' }
          - { name: '3.29_TextureView', flutter: '3.29.0', description: 'v29 (TextureView)' }

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Flutter using FVM
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ matrix.project.flutter }}
        channel: 'stable'
        cache: true

    - name: Decode Keystore
      if: secrets.KEYSTORE_BASE64 != ''
      run: |
        mkdir -p ${{ matrix.project.name }}/android/app/signing
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ matrix.project.name }}/android/app/signing/release.keystore
      
    - name: Setup Android app signing
      if: secrets.KEYSTORE_BASE64 != ''
      run: |
        cat > ${{ matrix.project.name }}/android/app/signing/keystore.properties << EOF
        storeFile=signing/release.keystore
        storePassword=${{ secrets.STORE_PASSWORD }}
        keyAlias=${{ secrets.KEY_ALIAS }}
        keyPassword=${{ secrets.KEY_PASSWORD }}
        EOF

    - name: Build Flutter APK for ${{ matrix.project.description }}
      run: |
        cd ${{ matrix.project.name }}
        flutter clean
        flutter pub get
        flutter build apk --release

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: friends-flutter-${{ matrix.project.description }}
        path: ${{ matrix.project.name }}/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Get version info
        id: version
        run: |
          echo "BUILD_TIME=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-apks/

      - name: List downloaded files
        run: ls -laR all-apks/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: auto-build-${{ steps.version.outputs.BUILD_TIME }}
          name: "🚀 Automated Build ${{ steps.version.outputs.BUILD_TIME }}"
          body: |
            **Automated build from commit `${{ steps.version.outputs.SHORT_SHA }}`**

            This release contains the following APKs:
            - `v27 (SurfaceView)`
            - `v29 (SurfaceView)`
            - `v27 (TextureView)`
            - `v29 (TextureView)`
          files: all-apks/**/*.apk
