name: Flutter CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - { name: '3.27', flutter: '3.27.0', description: 'v27 (SurfaceView)' }
          - { name: '3.29', flutter: '3.29.0', description: 'v29 (SurfaceView)' }
          - { name: '3.27_TextureView', flutter: '3.27.0', description: 'v27 (TextureView)' }
          - { name: '3.29_TextureView', flutter: '3.29.0', description: 'v29 (TextureView)' }

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ matrix.project.flutter }}
        channel: 'stable'
        cache: true

    - name: Decode Keystore and Setup Signing
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "🔐 Setting up Android app signing for ${{ matrix.project.name }}"...
          mkdir -p ${{ matrix.project.name }}/android/app/signing
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ matrix.project.name }}/android/app/signing/release.keystore
          echo -e "storeFile=signing/release.keystore\nstorePassword=$STORE_PASSWORD\nkeyAlias=$KEY_ALIAS\nkeyPassword=$KEY_PASSWORD" > ${{ matrix.project.name }}/android/app/signing/keystore.properties
          echo "✅ Signing configuration completed."
        else
          echo "⚠️ No signing configuration found, will use debug signing."
        fi

    - name: Build Flutter APK for ${{ matrix.project.description }}
      run: |
        cd ${{ matrix.project.name }}
        flutter clean
        flutter pub get
        flutter build apk --release

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: friends-flutter-${{ matrix.project.description }}
        path: ${{ matrix.project.name }}/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Get version info
        id: version
        run: |
          echo "BUILD_TIME=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-apks/

      - name: List and Rename APKs
        run: |
          echo "--- Original Files ---"
          ls -laR all-apks/
          for dir in all-apks/*/; 
          do
            if [ -f "${dir}app-release.apk" ]; then
              sanitized_name=$(basename "$dir" | tr -d '() ')
              mv "${dir}app-release.apk" "all-apks/friends-flutter-${sanitized_name}.apk"
              rm -r "$dir"
            fi
          done
          echo "--- Renamed Files ---"
          ls -laR all-apks/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: auto-build-${{ steps.version.outputs.BUILD_TIME }}
          name: "🚀 Automated Build ${{ steps.version.outputs.BUILD_TIME }}"
          body: |
            **Automated build from commit `${{ steps.version.outputs.SHORT_SHA }}`**

            This release contains the following APKs:
            - `v27 (SurfaceView)`
            - `v29 (SurfaceView)`
            - `v27 (TextureView)`
            - `v29 (TextureView)`
          files: all-apks/*.apk
